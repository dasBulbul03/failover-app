name: Terraform Validation & Security Lint

on:
  push:
    paths:
      - 'infra/**'
  pull_request:
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  security-events: write  # for SARIF upload
  contents: read

jobs:
  validate-aws-terraform:
    name: Validate AWS Terraform Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Check Terraform Formatting (AWS)
        run: |
          cd infra/aws
          terraform fmt -check -recursive

      - name: Validate AWS Root Module
        run: |
          cd infra/aws
          terraform init -backend=false
          terraform validate

  validate-azure-terraform:
    name: Validate Azure Terraform Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Check Terraform Formatting (Azure)
        run: |
          cd infra/azure
          terraform fmt -check

      - name: Validate Azure Module
        run: |
          cd infra/azure
          terraform init -backend=false
          terraform validate

  # ---------------------------------------------------------------------------
  # tfsec — Terraform security static analysis
  # Scans both AWS and Azure Terraform for security misconfigurations.
  # Results uploaded to GitHub Security → Code Scanning tab.
  # ---------------------------------------------------------------------------
  tfsec-aws:
    name: tfsec Security Scan (AWS Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec on AWS Terraform (SARIF)
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          working_directory: infra/aws
          sarif_file: tfsec-aws.sarif

      - name: Upload tfsec AWS results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-aws.sarif
          category: 'tfsec-aws'

      - name: Run tfsec (table output — fail on HIGH/CRITICAL)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/aws
          minimum_severity: HIGH
          soft_fail: false

  tfsec-azure:
    name: tfsec Security Scan (Azure Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec on Azure Terraform (SARIF)
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          working_directory: infra/azure
          sarif_file: tfsec-azure.sarif

      - name: Upload tfsec Azure results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-azure.sarif
          category: 'tfsec-azure'

      - name: Run tfsec Azure (table — HIGH/CRITICAL)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/azure
          minimum_severity: HIGH
          soft_fail: true  # Azure infra not yet deployed; allow warnings

  # ---------------------------------------------------------------------------
  # checkov — Broad IaC security/compliance scanner
  # ---------------------------------------------------------------------------
  checkov:
    name: Checkov IaC Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov on infra/
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true  # Report findings without blocking (fix progressively)

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: 'checkov'
