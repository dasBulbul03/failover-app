name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: failover-app
  ECS_CLUSTER: failover-cluster
  ECS_SERVICE: failover-service

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present

  build-and-deploy:
    name: Build & Push to ECR & Update ECS
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to ECS Fargate
        run: |
          echo "🔄 Forcing new deployment on ECS cluster $ECS_CLUSTER / service $ECS_SERVICE..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Verify live endpoint health
        run: |
          sleep 20
          HEALTH_URL="http://failover-alb-97690356.ap-southeast-2.elb.amazonaws.com/api/health"
          echo "Checking health at: $HEALTH_URL"
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed!"
              curl -s "$HEALTH_URL" | jq .
              break
            fi
            echo "Attempt $i: HTTP $STATUS - waiting..."
            sleep 10
          done

      - name: Post deployment summary
        run: |
          echo "## 🚀 AWS Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL**: http://failover-alb-97690356.ap-southeast-2.elb.amazonaws.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Endpoint**: http://failover-alb-97690356.ap-southeast-2.elb.amazonaws.com/api/health" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
