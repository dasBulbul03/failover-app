name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: failover-app
  ECS_CLUSTER: failover-cluster
  ECS_SERVICE: failover-service

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build-and-deploy:
    name: Build & Push to ECR & Update ECS
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Supports both OIDC Workload Identity Federation (role-to-assume) and static keys
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          # Try pushing :latest tag (succeeds if MUTABLE, harmlessly caught if IMMUTABLE)
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest || echo "ℹ️ Note: ECR repository tag mutability is IMMUTABLE; latest tag overwrite skipped."
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to ECS Fargate (Immutable Image Revision)
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          echo "🔄 Deploying immutable image: $IMAGE_URI to cluster $ECS_CLUSTER / service $ECS_SERVICE..."
          
          SERVICE_STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION" --query "services[0].status" --output text 2>/dev/null || echo "MISSING")
          
          if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
            CURRENT_TASK_DEF_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION" --query "services[0].taskDefinition" --output text)
            echo "Current Task Def ARN: $CURRENT_TASK_DEF_ARN"

            aws ecs describe-task-definition --task-definition "$CURRENT_TASK_DEF_ARN" --region "$AWS_REGION" --query "taskDefinition" > task-def.json
            
            # Substitute image and strip read-only metadata fields required for register-task-definition
            jq --arg IMAGE "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-def.json > new-task-def.json
            
            NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --region "$AWS_REGION" --query "taskDefinition.taskDefinitionArn" --output text)
            echo "✅ Registered new task definition: $NEW_TASK_DEF_ARN"

            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --task-definition "$NEW_TASK_DEF_ARN" \
              --region "$AWS_REGION"
            echo "✅ ECS service update initiated."
          else
            echo "⚠️ ECS service not found in region $AWS_REGION. Forcing service deployment if service exists under alternate name..."
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --force-new-deployment \
              --region "$AWS_REGION" 2>/dev/null || echo "ECS service deployment skipped."
          fi

      - name: Resolve ALB Endpoint
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "failover-app-alb" --region "$AWS_REGION" --query "LoadBalancers[0].DNSName" --output text 2>/dev/null || echo "")
          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            ALB_DNS="${{ secrets.AWS_ALB_DNS || 'failover-alb-97690356.ap-southeast-2.elb.amazonaws.com' }}"
          fi
          echo "dns_name=$ALB_DNS" >> $GITHUB_OUTPUT
          echo "Resolved ALB DNS: $ALB_DNS"

      - name: Verify live endpoint health
        env:
          ALB_DNS: ${{ steps.alb.outputs.dns_name }}
        run: |
          sleep 20
          HEALTH_URL="http://$ALB_DNS/api/health?probe=readiness"
          echo "Checking health at: $HEALTH_URL"
          HEALTHY=false
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed with HTTP 200!"
              curl -s "$HEALTH_URL" | jq .
              HEALTHY=true
              break
            fi
            echo "Attempt $i/12: HTTP $STATUS - waiting 10s..."
            sleep 10
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "❌ CRITICAL: Application health check failed after 12 retries (HTTP $STATUS)!"
            exit 1
          fi

      - name: Post deployment summary
        env:
          ALB_DNS: ${{ steps.alb.outputs.dns_name }}
        run: |
          echo "## 🚀 AWS Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL**: http://$ALB_DNS" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Endpoint**: http://$ALB_DNS/api/health" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
